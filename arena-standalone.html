<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Arena</title>
<style>
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0a0c14}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#e8ecff;font-family:system-ui,sans-serif}
  main{width:min(96vw,900px)}
  canvas{display:block;width:100%;height:auto;border:2px solid #2b3350;border-radius:10px;background:#0d1020;touch-action:none}
  p{text-align:center;color:#9aa3c7;font-size:.85rem;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <canvas id="g" width="800" height="600" aria-label="Neon Arena game"></canvas>
  <p>WASD / arrows or touch joystick to move · Space or DASH button · P pause · M mute · 1-3 pick upgrades</p>
</main>
<script>
const cv=document.getElementById("g"),c=cv.getContext("2d"),W=800,H=600;
const keys={};let touch=null,lastTap=0,joy=null;
let P,E,B,EB,G,PT,wave,wt,sc,kills,state="menu",shake=0,spT,time,choices=[],best=0,fl=0;
try{best=+localStorage.getItem("neon-best")||0}catch(e){}
const T={
  c:{r:11,hp:20,sp:75,col:"#ff5d73",dmg:10,xp:1},
  f:{r:8,hp:10,sp:150,col:"#ff9f43",dmg:6,xp:1},
  t:{r:20,hp:95,sp:45,col:"#a66bff",dmg:18,xp:4},
  s:{r:11,hp:28,sp:55,col:"#ffe66d",dmg:8,xp:2,sh:1.7},
  b:{r:44,hp:950,sp:38,col:"#ff3d9a",dmg:25,xp:30,sh:1.3}
};
const UPS=[
  {n:"Rapid Fire",d:"+25% fire rate",f:()=>P.rate*=.8},
  {n:"Heavy Rounds",d:"+30% damage",f:()=>P.dmg*=1.3},
  {n:"Multishot",d:"+1 projectile",f:()=>P.multi++},
  {n:"Piercing",d:"Bullets pierce +1 enemy",f:()=>P.pierce++},
  {n:"Swift Boots",d:"+12% move speed",f:()=>P.spd*=1.12},
  {n:"Vitality",d:"+25 max HP and heal 25",f:()=>{P.mhp+=25;P.hp=Math.min(P.mhp,P.hp+25)}},
  {n:"Magnet",d:"+50% pickup range",f:()=>P.mag*=1.5},
  {n:"Orbit Blade",d:"+1 spinning blade",f:()=>P.blades++},
  {n:"Quick Dash",d:"Dash cooldown -25%",f:()=>P.dcd*=.75},
  {n:"Shockwave",d:"Dash blasts nearby enemies",f:()=>P.shock=1}
];
const MAX=150; // maximum level
const CHEAT=false; // true = start at max level on wave 30 (test mode)
let K; // clone of the player
function init(){audio();
  P={x:W/2,y:H/2,r:12,hp:100,mhp:100,spd:230,rate:.35,cd:0,dmg:10,multi:1,pierce:0,mag:70,blades:0,ang:0,
     dcd:2.5,dt:0,dash:0,inv:0,xp:0,lv:1,need:5,shock:0,dx:1,dy:0};
  E=[];B=[];EB=[];G=[];PT=[];wave=CHEAT?30:1;wt=0;sc=0;kills=0;spT=0;time=0;state="play";if(CHEAT)spawn("b");
  // Start at MAX level: every upgrade stacked evenly, with sane caps
  for(let i=0;i<(CHEAT?MAX-1:0);i++)UPS[i%UPS.length].f();
  if(CHEAT){P.lv=MAX;P.need=1;P.xp=0}
  P.spd=Math.min(P.spd,420);P.dcd=Math.max(P.dcd,.4);P.rate=Math.max(P.rate,.05);
  P.mag=Math.min(P.mag,500);P.blades=Math.min(P.blades,10);P.multi=Math.min(P.multi,15);P.pierce=Math.min(P.pierce,15);P.hp=P.mhp;
  K={x:P.x-40,y:P.y,ang:Math.PI,cd:0};
}
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function burst(x,y,col,n,sp=140){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(30,sp);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.7),c:col})}}
function spawn(type){
  if(E.length>=350)return; // performance cap
  const side=Math.floor(rnd(0,4)),m=30;let x,y;
  if(side==0){x=rnd(0,W);y=-m}else if(side==1){x=W+m;y=rnd(0,H)}else if(side==2){x=rnd(0,W);y=H+m}else{x=-m;y=rnd(0,H)}
  const d=T[type],hp=d.hp*(1+wave*.14);
  E.push({x,y,type,r:d.r,hp,mhp:hp,sp:d.sp*(1+wave*.015),col:d.col,dmg:d.dmg*(1+wave*.03),xp:d.xp,sc:rnd(0,d.sh||1),bc:0,fl:0});
}
function pickType(){
  const r=Math.random();
  if(wave>=6&&r<.12)return"t";
  if(wave>=3&&r<.28)return"s";
  if(wave>=2&&r<.5)return"f";
  if(wave>=4&&r<.55)return"t";
  return"c";
}
function nearest(){let b=null,bd=1e9;for(const e of E){const d=dist(e,P);if(d<bd){bd=d;b=e}}return b}
function dash(){
  if(P.dt>0||state!="play")return;
  P.dt=P.dcd;P.dash=.16;P.inv=.3;sfx("dash");
  if(P.shock){burst(P.x,P.y,"#6df",30,260);shake=6;for(const e of E)if(dist(e,P)<110)hurt(e,P.dmg*3)}
}
function hurt(e,d){e.hp-=d;e.fl=.08;sfx(e.hp<=0?"kill":"hit");if(e.hp<=0&&!e.dead){e.dead=1;kills++;sc+=Math.round(e.xp*10);
  burst(e.x,e.y,e.col,e.type=="b"?60:12);if(e.type=="b")shake=14;
  for(let i=0;i<e.xp;i++)G.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),v:1})}}
function levelUp(){
  if(P.lv>=MAX){P.xp=0;return}
  sfx("lvl");P.lv++;P.xp-=P.need;P.need=Math.ceil(P.need*1.35+2);
  choices=[...UPS].sort(()=>Math.random()-.5).slice(0,3);state="levelup";
}
function update(dt){
  time+=dt;wt+=dt;
  if(wt>25){wt=0;wave++;if(wave%5==0){spawn("b");sfx("boss")}}
  spT-=dt;const iv=Math.max(.22,1.1-wave*.06);
  if(spT<=0){spT=iv;const n=CHEAT?2+Math.floor(wave/5):1+Math.floor(wave/6);for(let i=0;i<n;i++)spawn(pickType())}
  // movement
  let mx=0,my=0;
  if(keys.ArrowLeft||keys.a)mx--;if(keys.ArrowRight||keys.d)mx++;
  if(keys.ArrowUp||keys.w)my--;if(keys.ArrowDown||keys.s)my++;
  if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>10){mx=dx/l;my=dy/l}}
  const l=Math.hypot(mx,my);if(l>0){mx/=l;my/=l;P.dx=mx;P.dy=my}
  const sp=P.dash>0?P.spd*3.4:P.spd;
  P.x=Math.max(P.r,Math.min(W-P.r,P.x+mx*sp*dt));P.y=Math.max(P.r,Math.min(H-P.r,P.y+my*sp*dt));
  if(P.dash>0){P.dash-=dt;if(!mx&&!my){P.x+=P.dx*sp*dt;P.y+=P.dy*sp*dt}PT.push({x:P.x,y:P.y,vx:0,vy:0,l:.25,c:"#6df"})}
  P.dt=Math.max(0,P.dt-dt);P.inv=Math.max(0,P.inv-dt);P.ang+=dt*3.2;
  // shooting
  P.cd-=dt;const tg=nearest();
  if(tg&&P.cd<=0){
    P.cd=P.rate;sfx("shoot");const a0=Math.atan2(tg.y-P.y,tg.x-P.x);
    for(let i=0;i<P.multi;i++){const a=a0+(i-(P.multi-1)/2)*.14;
      B.push({x:P.x,y:P.y,vx:Math.cos(a)*560,vy:Math.sin(a)*560,dmg:P.dmg,life:1.1,pi:P.pierce,h:new Set()})}
  }
  for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    for(const e of E)if(!e.dead&&!b.h.has(e)&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){
      b.h.add(e);hurt(e,b.dmg);burst(b.x,b.y,"#fff",3,80);if(b.pi--<=0){b.life=0;break}}}
  B=B.filter(b=>b.life>0);
  // clone: follows the player, fires and slashes with the same stats
  {const tx=P.x-P.dx*55+Math.cos(time*2)*20,ty=P.y-P.dy*55+Math.sin(time*2)*20,k=Math.min(1,dt*6);
   K.x+=(tx-K.x)*k;K.y+=(ty-K.y)*k;K.ang-=dt*3.2;K.cd-=dt;
   let t2=null,bd=1e9;for(const e of E){const d=Math.hypot(e.x-K.x,e.y-K.y);if(d<bd){bd=d;t2=e}}
   if(t2&&K.cd<=0){K.cd=P.rate;const a0=Math.atan2(t2.y-K.y,t2.x-K.x);
     for(let i=0;i<P.multi;i++){const a=a0+(i-(P.multi-1)/2)*.14;
       B.push({x:K.x,y:K.y,vx:Math.cos(a)*560,vy:Math.sin(a)*560,dmg:P.dmg,life:1.1,pi:P.pierce,h:new Set()})}}
   for(let i=0;i<P.blades;i++){const a=K.ang+i*6.283/P.blades,bx=K.x+Math.cos(a)*58,by=K.y+Math.sin(a)*58;
     for(const e of E)if(!e.dead&&e.bc<=0&&Math.hypot(e.x-bx,e.y-by)<e.r+9){hurt(e,P.dmg*1.2);e.bc=.3}}}
  // blades
  for(let i=0;i<P.blades;i++){const a=P.ang+i*6.283/P.blades,bx=P.x+Math.cos(a)*58,by=P.y+Math.sin(a)*58;
    for(const e of E)if(!e.dead&&e.bc<=0&&Math.hypot(e.x-bx,e.y-by)<e.r+9){hurt(e,P.dmg*1.2);e.bc=.3}}
  // enemies
  for(const e of E){
    e.bc-=dt;e.fl-=dt;const a=Math.atan2(P.y-e.y,P.x-e.x),d=dist(e,P);
    const keep=(e.type=="s"&&d<220)?-1:1;
    e.x+=Math.cos(a)*e.sp*dt*keep;e.y+=Math.sin(a)*e.sp*dt*keep;
    const sh=T[e.type].sh;
    if(sh){e.sc-=dt;if(e.sc<=0){e.sc=sh;
      if(e.type=="b")for(let i=0;i<12;i++){const q=i*.5236+time;EB.push({x:e.x,y:e.y,vx:Math.cos(q)*170,vy:Math.sin(q)*170,l:4})}
      else EB.push({x:e.x,y:e.y,vx:Math.cos(a)*210,vy:Math.sin(a)*210,l:4})}}
    if(P.inv<=0&&d<e.r+P.r-2){P.hp-=e.dmg;P.inv=.7;shake=8;sfx("ouch");burst(P.x,P.y,"#f55",14)}
  }
  for(const q of EB){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;
    if(P.inv<=0&&Math.hypot(q.x-P.x,q.y-P.y)<P.r+4){P.hp-=8;P.inv=.7;q.l=0;shake=6;sfx("ouch");burst(P.x,P.y,"#f55",10)}}
  EB=EB.filter(q=>q.l>0&&q.x>-20&&q.x<W+20&&q.y>-20&&q.y<H+20);
  E=E.filter(e=>!e.dead);
  // gems
  for(const g of G){const d=dist(g,P);
    if(d<P.mag){const s=240*dt/Math.max(d,1);g.x+=(P.x-g.x)*s*2;g.y+=(P.y-g.y)*s*2}
    if(d<P.r+6){g.dead=1;P.xp+=g.v;sfx("gem")}}
  G=G.filter(g=>!g.dead);
  if(P.xp>=P.need)levelUp();
  for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}PT=PT.filter(p=>p.l>0);
  shake=Math.max(0,shake-dt*30);
  if(P.hp<=0)gameOver();
}
function gameOver(){sfx("over");
  state="over";
  if(sc>best){best=sc;try{localStorage.setItem("neon-best",best)}catch(e){}}
}
function glow(col,b){c.shadowColor=col;c.shadowBlur=b}
function circ(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,6.283);c.fill()}
function txt(s,x,y,sz,col="#e8ecff",al="center"){c.font="600 "+sz+"px system-ui,sans-serif";c.textAlign=al;c.fillStyle=col;c.fillText(s,x,y)}
function draw(){
  c.save();c.drawImage(BG,0,0);
  if(shake>0)c.translate(rnd(-shake,shake),rnd(-shake,shake));
  c.strokeStyle="rgba(120,140,255,.08)";c.lineWidth=1;
  for(let x=0;x<=W;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}
  for(let y=0;y<=H;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
  if(P){
    for(const g of G){glow("#5ef0a0",8);circ(g.x,g.y,4,"#5ef0a0")}
    for(const p of PT){c.globalAlpha=Math.min(1,p.l*2.5);circ(p.x,p.y,2.5,p.c)}c.globalAlpha=1;
    glow("#fff",10);for(const b of B)circ(b.x,b.y,4,"#fff");
    glow("#f55",10);for(const q of EB)circ(q.x,q.y,5,"#ff7a7a");
    for(const e of E){glow(e.col,12);circ(e.x,e.y,e.r,e.fl>0?"#fff":e.col);
      if(e.type=="t"||e.type=="b"){glow("transparent",0);c.fillStyle="#0008";c.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);
        c.fillStyle="#6f6";c.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*e.hp/e.mhp,4)}}
    for(let i=0;i<P.blades;i++){const a=P.ang+i*6.283/P.blades;glow("#6df",14);circ(P.x+Math.cos(a)*58,P.y+Math.sin(a)*58,9,"#9ef")}
    for(let i=0;i<P.blades;i++){const a=K.ang+i*6.283/P.blades;glow("#6df",14);circ(K.x+Math.cos(a)*58,K.y+Math.sin(a)*58,9,"#9ef")}
    glow("#6df",18);circ(K.x,K.y,P.r,"#8fe3ff");
    glow("#5ef0a0",18);c.globalAlpha=P.inv>0&&Math.floor(time*20)%2?.4:1;circ(P.x,P.y,P.r,"#b8ffd0");c.globalAlpha=1;
    glow("transparent",0);
    if(P.dt>0){c.strokeStyle="#6df";c.lineWidth=2;c.beginPath();c.arc(P.x,P.y,P.r+6,-1.57,-1.57+6.283*(1-P.dt/P.dcd));c.stroke()}
    // HUD
    c.fillStyle="#1b2140";c.fillRect(0,0,W,8);c.fillStyle=P.lv>=MAX?"#ffe66d":"#5ef0a0";c.fillRect(0,0,P.lv>=MAX?W:W*P.xp/P.need,8);
    c.fillStyle="#1b2140";c.fillRect(12,18,180,14);c.fillStyle="#ff5d73";c.fillRect(12,18,180*Math.max(0,P.hp)/P.mhp,14);
    txt(Math.ceil(Math.max(0,P.hp))+" / "+P.mhp,102,29,11,"#fff");
    txt("Wave "+wave+"  ·  Lv "+(P.lv>=MAX?"MAX":P.lv),12,52,14,"#e8ecff","left");
    txt("Score "+sc,W-12,30,16,"#e8ecff","right");txt("Best "+best,W-12,50,12,"#9aa3c7","right");
  }
  c.restore();glow("transparent",0);
  if(P&&state=="play"){
    c.lineWidth=2;
    for(const k of ["pause","mute","dash"]){const b=BTN[k];c.fillStyle="#000a";c.strokeStyle="#5ef0a0";c.beginPath();c.arc(b.x,b.y,b.r,0,6.283);c.fill();c.stroke();
      txt(k=="pause"?"❚❚":k=="mute"?(muted?"🔇":"🔊"):"DASH",b.x,b.y+(k=="dash"?5:6),k=="dash"?13:14,"#e8ecff")}
    if(joy){c.strokeStyle="#ffffff66";c.beginPath();c.arc(joy.ox,joy.oy,50,0,6.283);c.stroke();
      const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
      c.fillStyle="#ffffff66";c.beginPath();c.arc(joy.ox+Math.cos(a)*l,joy.oy+Math.sin(a)*l,22,0,6.283);c.fill()}
  }
  if(state=="menu"||state=="over"||state=="paused"||state=="levelup"){c.fillStyle="#000a";c.fillRect(0,0,W,H)}
  if(state=="menu"){
    txt("NEON ARENA",W/2,230,56,"#b8ffd0");
    txt("Survive the waves. Your weapon fires automatically.",W/2,290,18,"#9aa3c7");
    txt("Collect green gems, level up and build your loadout.",W/2,318,18,"#9aa3c7");
    txt("Boss every 5 waves. Survive as long as you can.",W/2,365,18,"#9aa3c7");bigBtn("▶  START",430);
  }
  if(state=="over"){
    txt("GAME OVER",W/2,220,52,"#ff5d73");
    txt("Score "+sc+"  ·  Wave "+wave+"  ·  Kills "+kills,W/2,280,22);
    txt(sc>=best?"New best score!":"Best "+best,W/2,316,18,"#ffe66d");
    bigBtn("▶  PLAY AGAIN",410);
  }
  if(state=="paused"){txt("PAUSED",W/2,250,44);bigBtn("▶  RESUME",330)}
  if(state=="levelup"){
    txt("LEVEL UP – choose an upgrade",W/2,150,30,"#b8ffd0");
    choices.forEach((u,i)=>{const x=60+i*240;
      c.fillStyle="#171c36";c.strokeStyle="#5ef0a0";c.lineWidth=2;c.fillRect(x,200,220,200);c.strokeRect(x,200,220,200);
      txt((i+1)+"",x+110,245,28,"#5ef0a0");txt(u.n,x+110,295,20);
      c.font="14px system-ui,sans-serif";c.fillStyle="#9aa3c7";c.textAlign="center";c.fillText(u.d,x+110,335,200)});
  }
}
function pick(i){if(state!="levelup"||!choices[i])return;choices[i].f();state="play";if(P.xp>=P.need)levelUp()}
// Background picture, painted once into an offscreen canvas
const BG=document.createElement("canvas");BG.width=W;BG.height=H;
(function(){
  const b=BG.getContext("2d");
  let g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,"#07061a");g.addColorStop(.6,"#1a0f3a");g.addColorStop(1,"#2a1048");
  b.fillStyle=g;b.fillRect(0,0,W,H);
  const neb=(x,y,r,col)=>{const n=b.createRadialGradient(x,y,0,x,y,r);n.addColorStop(0,col);n.addColorStop(1,"transparent");b.fillStyle=n;b.fillRect(0,0,W,H)};
  neb(180,140,260,"rgba(120,60,255,.35)");neb(640,220,300,"rgba(255,60,160,.25)");neb(420,420,320,"rgba(40,160,255,.18)");
  for(let i=0;i<160;i++){b.globalAlpha=rnd(.2,.9);b.fillStyle="#fff";b.beginPath();b.arc(rnd(0,W),rnd(0,H*.8),rnd(.4,1.5),0,6.283);b.fill()}
  b.globalAlpha=1;
  const pg=b.createRadialGradient(590,150,10,600,160,70);pg.addColorStop(0,"#ffb36b");pg.addColorStop(1,"#6b2a8a");
  b.fillStyle=pg;b.beginPath();b.arc(600,160,64,0,6.283);b.fill();
  b.strokeStyle="rgba(255,220,180,.55)";b.lineWidth=6;b.beginPath();b.ellipse(600,160,110,22,-.35,0,6.283);b.stroke();
  b.fillStyle="#cfd6ff";b.beginPath();b.arc(140,110,26,0,6.283);b.fill();
  b.fillStyle="#9aa3d6";b.beginPath();b.arc(130,104,6,0,6.283);b.arc(150,120,4,0,6.283);b.fill();
  let x=0;while(x<W){const w=rnd(30,70),h=rnd(60,200);b.fillStyle="#0a0818";b.fillRect(x,H-h,w,h);
    for(let wy=H-h+10;wy<H-8;wy+=14)for(let wx=x+6;wx<x+w-8;wx+=12)if(Math.random()<.35){
      b.fillStyle=Math.random()<.5?"#ffe66d":"#6df";b.globalAlpha=.7;b.fillRect(wx,wy,4,6);b.globalAlpha=1}
    x+=w+rnd(0,6)}
  b.fillStyle="rgba(5,6,16,.35)";b.fillRect(0,0,W,H); // keep gameplay readable
})();
// ---- Sound: tiny WebAudio synth (sound effects + looping music) ----
let AC=null,muted=false;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=="suspended")AC.resume();return AC}
function tone(f,d,type="square",vol=.05,slide=0){if(muted||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
const seq=(fs,type,gap,d,v)=>fs.forEach((f,i)=>setTimeout(()=>tone(f,d,type,v),i*gap));
const SFX={shoot:()=>tone(640,.05,"square",.015,-300),hit:()=>tone(200,.06,"sawtooth",.02,-80),kill:()=>tone(320,.1,"triangle",.04,-200),
  gem:()=>tone(880,.06,"sine",.025,300),ouch:()=>tone(130,.25,"sawtooth",.07,-60),dash:()=>tone(300,.18,"sine",.05,600),
  lvl:()=>seq([523,659,784,1047],"triangle",90,.15,.06),boss:()=>seq([110,98,87],"sawtooth",220,.3,.07),over:()=>seq([392,330,262,196],"triangle",180,.3,.07)};
const GAP={shoot:90,hit:60,kill:50,gem:45},LAST={};
function sfx(n){const t=performance.now();if(t-(LAST[n]||0)<(GAP[n]||0))return;LAST[n]=t;SFX[n]()}
let mi=0;const NOTES=[110,110,130.8,146.8,110,164.8,146.8,130.8];
setInterval(()=>{if(!AC||muted||state!="play")return;const f=NOTES[mi%8];tone(f,.28,"triangle",.04);if(mi%2==0)tone(f*4,.09,"square",.01);mi++},230);
// ---- On-screen buttons ----
const BTN={pause:{x:W-30,y:84,r:18},mute:{x:W-72,y:84,r:18},dash:{x:W-80,y:H-80,r:46}};
function bigBtn(s,y){c.fillStyle="#5ef0a0";c.beginPath();c.roundRect(W/2-120,y-30,240,60,14);c.fill();txt(s,W/2,y+8,24,"#07130c")}
let last=0;
function frame(t){
  const dt=Math.min((t-last)/1000||0,.05);last=t;
  if(state=="play")update(dt);
  draw();requestAnimationFrame(frame);
}
addEventListener("keydown",e=>{
  const k=e.key.length==1?e.key.toLowerCase():e.key;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  keys[k]=true;
  if(k==" ")dash();
  if(k=="Enter"&&(state=="menu"||state=="over"))init();
  if(k=="p"){if(state=="play")state="paused";else if(state=="paused")state="play"}
  if(k=="m")muted=!muted;
  if(state=="levelup"&&"123".includes(k))pick(+k-1);
});
addEventListener("keyup",e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=false});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;if(state=="play")state="paused"});
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener("pointerdown",e=>{
  const p=pos(e);
  if(state=="menu"||state=="over"){init();return}
  if(state=="paused"){state="play";return}
  if(state=="levelup"){choices.forEach((u,i)=>{const x=60+i*240;if(p.x>x&&p.x<x+220&&p.y>200&&p.y<400)pick(i)});return}
  const inB=b=>Math.hypot(p.x-b.x,p.y-b.y)<b.r+8;
  if(inB(BTN.pause)){state="paused";return}
  if(inB(BTN.mute)){muted=!muted;return}
  if(inB(BTN.dash)){dash();return}
  const n=performance.now();if(n-lastTap<300)dash();lastTap=n;
  if(!joy){joy={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}}
});
cv.addEventListener("pointermove",e=>{if(joy&&e.pointerId==joy.id){const p=pos(e);joy.x=p.x;joy.y=p.y}});
addEventListener("pointerup",e=>{if(joy&&e.pointerId==joy.id)joy=null});
addEventListener("pointercancel",()=>{joy=null});
requestAnimationFrame(frame);
</script>
</body>
</html>
